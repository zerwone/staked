# Publishes docs/site to GitHub Pages on every push to main.
# One-time: Settings → Pages → Source: GitHub Actions (needs the repo to be public on a free plan).
name: site
on:
  push:
    branches: [main]
    paths: [docs/site/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node docs/site/check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/site }
      - id: d
        uses: actions/deploy-pages@v4
